<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Violence Detection AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 380px;
            padding: 40px;
            background: #1e293b;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #475569;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        p {
            text-align: center;
            color: #cbd5e1;
        }

        a {
            color: #38bdf8;
        }

        .message {
            color: #f87171;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <h1>Create Account</h1>

        {% if m1 %}
        <p class="message">{{ m1 }}</p>
        {% endif %}

        <form action="/register" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">Register</button>

        </form>

        <p>
            Already registered?
            <a href="/logina">Login</a>
        </p>

        <p>
            <a href="/">Back to Home</a>
        </p>

    </div>

</div>

</body>
</html>
